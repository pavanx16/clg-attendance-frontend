[project]
name = "attendace-frontend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Pavan Pandya", email = "pavanpandya016@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mypy>=2.3.1",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.3",
    "ruff>=0.16.5",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
attendace-frontend = "attendace_frontend:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.5",
]
